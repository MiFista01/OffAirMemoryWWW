<div
  class="stage"
  [class.stage--zoomed]="zoomed && !isWallOpen"
  [class.stage--wall]="isWallOpen"
>
  <div
    class="area"
    [style.--wall-ox]="wallFocusX"
    [style.--wall-oy]="wallFocusY"
  >
    <img class="area__bg" src="/imgs/bg.webp" alt="">

    <button
      type="button"
      class="wall-pic"
      [class.wall-pic--open]="wallOpen === 'faq'"
      [style.--x]="faqPic.x"
      [style.--y]="faqPic.y"
      [style.--w]="faqPic.w"
      [style.--h]="faqPic.h"
      aria-label="FAQ"
      [attr.aria-expanded]="wallOpen === 'faq'"
      (click)="onFaqClick()"
    >
      <span class="wall-pic__hang">
        <span class="wall-pic__flip">
          <span class="wall-pic__face wall-pic__face--front">
            <img src="/imgs/faq.webp" alt="">
          </span>
          <span class="wall-pic__face wall-pic__face--back">
            <img src="/imgs/faq blank.webp" alt="">
            <span class="wall-pic__text wall-pic__text--faq">
              <b>FAQ</b>
              <ul>
                <li>красная кнопка — ТВ вкл/выкл</li>
                <hr>
                <li>жёлтая кнопка — пульт при движении</li>
                <hr>
                <li>GUID (на пульте) — расписание</li>
                <hr>
                <li>± (по бокам на пульте) — громкость</li>
                <hr>
                <li>сегмент перезапускается <span>→</span> перезагрузка</li>
              </ul>
            </span>
          </span>
        </span>
      </span>
    </button>

    <button
      type="button"
      class="wall-pic"
      [class.wall-pic--open]="wallOpen === 'why'"
      [style.--x]="whyPic.x"
      [style.--y]="whyPic.y"
      [style.--w]="whyPic.w"
      [style.--h]="whyPic.h"
      aria-label="О проекте"
      [attr.aria-expanded]="wallOpen === 'why'"
      (click)="onWhyClick()"
    >
      <span class="wall-pic__hang">
        <span class="wall-pic__flip">
          <span class="wall-pic__face wall-pic__face--front">
            <img src="/imgs/why.webp" alt="">
          </span>
          <span class="wall-pic__face wall-pic__face--back">
            <img src="/imgs/why blank.webp" alt="">
            <span class="wall-pic__text wall-pic__text--why">
              <b>WHY?</b>
              Не ради денег — ради ощущения.
              Хочу вернуть людям моего возраста ту атмосферу детства у экрана: щелчок пульта, тёплый гул, вечер на диване.
            </span>
          </span>
        </span>
      </span>
    </button>

    <div class="tv">
      <router-outlet></router-outlet>
      <img class="tv__frame" src="/imgs/tv.webp" alt="">

      <button
        type="button"
        class="tv__bezel-btn"
        [style.--x]="tvPowerBtn.x"
        [style.--y]="tvPowerBtn.y"
        [style.--w]="tvPowerBtn.w"
        [style.--h]="tvPowerBtn.h"
        [attr.aria-label]="tvOn ? 'Turn TV off' : 'Turn TV on'"
        [attr.aria-pressed]="tvOn"
        (click)="onTvPowerClick(); $event.stopPropagation()"
      >
        <img [src]="tvPowerSrc()" alt="">
      </button>

      <button
        type="button"
        class="tv__bezel-btn"
        [style.--x]="tvRemoteBtn.x"
        [style.--y]="tvRemoteBtn.y"
        [style.--w]="tvRemoteBtn.w"
        [style.--h]="tvRemoteBtn.h"
        [attr.aria-label]="remoteEnabled ? 'Hide remote on move' : 'Show remote on move'"
        [attr.aria-pressed]="remoteEnabled"
        (click)="onTvRemoteClick(); $event.stopPropagation()"
      >
        <img [src]="tvRemoteSrc()" alt="">
      </button>
    </div>

    @if (!zoomed && !isWallOpen) {
      <button
        type="button"
        class="hint-arrow"
        [class.hint-arrow--visible]="arrowVisible"
        (click)="onArrowClick()"
        aria-label="Zoom to TV"
      >
        <img src="/imgs/arrow.webp" alt="">
      </button>
    }
  </div>
</div>

@if (zoomed && !isWallOpen) {
  <button
    type="button"
    class="hint-arrow hint-arrow--out"
    [class.hint-arrow--visible]="arrowVisible"
    (click)="onArrowClick()"
    aria-label="Zoom out"
  >
    <img src="/imgs/arrow.webp" alt="">
  </button>
}

<div
  class="remote"
  [class.remote--visible]="remoteVisible"
  aria-label="TV remote"
>
  <img class="remote__body" src="/imgs/remote/remote.webp" alt="">

  <button
    type="button"
    class="remote__btn"
    [style.--x]="guideBtn.x"
    [style.--y]="guideBtn.y"
    [style.--w]="guideBtn.w"
    [style.--h]="guideBtn.h"
    [attr.aria-label]="guideBtn.label"
    [attr.aria-pressed]="guideOpen"
    (pointerenter)="onRemoteEnter()"
    (pointerdown)="onBtnPointerDown(guideBtn, $event)"
    (pointerup)="onBtnPointerUp()"
    (pointerleave)="onBtnPointerUp(); onRemoteLeave()"
    (pointercancel)="onBtnPointerUp()"
    (click)="onGuideClick()"
  >
    <img [src]="btnSrc(guideBtn)" alt="">
  </button>

  @for (btn of soundBtns; track btn.id) {
    <button
      type="button"
      class="remote__btn"
      [style.--x]="btn.x"
      [style.--y]="btn.y"
      [style.--w]="btn.w"
      [style.--h]="btn.h"
      [attr.aria-label]="btn.label"
      (pointerenter)="onRemoteEnter()"
      (pointerdown)="onBtnPointerDown(btn, $event)"
      (pointerup)="onBtnPointerUp()"
      (pointerleave)="onBtnPointerUp(); onRemoteLeave()"
      (pointercancel)="onBtnPointerUp()"
      (click)="onSoundClick(btn)"
    >
      <img [src]="btnSrc(btn)" alt="">
    </button>
  }

  @for (ch of channels; track ch.id) {
    <button
      type="button"
      class="remote__btn"
      [style.--x]="ch.x"
      [style.--y]="ch.y"
      [style.--w]="ch.w"
      [style.--h]="ch.h"
      [attr.aria-label]="ch.label"
      [attr.aria-pressed]="activeSlug === ch.slug"
      (pointerenter)="onRemoteEnter()"
      (pointerdown)="onBtnPointerDown(ch, $event)"
      (pointerup)="onBtnPointerUp()"
      (pointerleave)="onBtnPointerUp(); onRemoteLeave()"
      (pointercancel)="onBtnPointerUp()"
      (click)="onChannelClick(ch)"
    >
      <img [src]="btnSrc(ch)" alt="">
    </button>
  }
</div>

<app-tv-guide
  [open]="guideOpen"
  [activeSlug]="activeSlug"
  (closed)="onGuideClosed()"
  (channelPick)="onGuideChannelPick($event)"
/>
