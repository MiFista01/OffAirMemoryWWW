<div class="watch">
  @if (loading) {
    <p class="watch__status">Starting stream…</p>
  }
  @if (error) {
    <p class="watch__error">{{ error }}</p>
  }
  <video #video class="watch__video" controls playsinline></video>
  @if (meta.episodeId) {
    <p class="watch__meta">ep {{ meta.episodeId }} · +{{ meta.offsetSec }}s</p>
  }
</div>
