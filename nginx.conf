# Off-Air Memory — Nginx (www container)
# /api /media /static → Nest  |  /stream → shared volume  |  / → Angular SPA
#
# No auth_request on /stream: it turned 429/upstream errors into HTTP 500 for HLS.
# Idle TTL is kept alive by the frontend /api/stream/:slug/heartbeat.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: re-resolve "server" after redeploy (avoids 502 on stale IP)
    set $oam_upstream server:3000;

    location /api/ {
        proxy_pass http://$oam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /static/ {
        proxy_pass http://$oam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://$oam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # HLS files from shared SSD volume (Nest writes, nginx reads)
    location /stream/ {
        alias /data/stream/;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin * always;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/iso.segment m4s;
            application/octet-stream m4s;
        }

        autoindex off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
