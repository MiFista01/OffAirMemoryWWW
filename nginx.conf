# Off-Air Memory — Nginx (www container)
# /api /media /static → Nest  |  /stream → shared volume  |  / → Angular SPA

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: re-resolve "server" after redeploy (avoids 502 on stale IP)
    set $oam_upstream server:3000;

    location /api/ {
        proxy_pass http://$oam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /static/ {
        proxy_pass http://$oam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://$oam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # HLS: Nest writes to STREAM_ROOT; nginx only reads (same volume)
    # auth_request → heartbeat idle TTL
    location /stream/ {
        auth_request /api/stream-hls-touch;
        alias /data/stream/;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin * always;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/iso.segment m4s;
            application/octet-stream m4s;
        }

        autoindex off;
    }

    location = /api/stream-hls-touch {
        internal;
        set $hls_folder "";
        if ($request_uri ~ "^/stream/([^/]+)/") {
            set $hls_folder $1;
        }
        proxy_pass http://$oam_upstream/api/stream/hls-touch?folder=$hls_folder;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
