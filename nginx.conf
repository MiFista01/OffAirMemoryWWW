# Off-Air Memory — Nginx (www container)
# /api /media /static → Nest  |  /stream → shared volume  |  / → Angular SPA
#
# No auth_request on /stream: it turned 429/upstream errors into HTTP 500 for HLS.
# Idle TTL is kept alive by the frontend /api/stream/:slug/heartbeat.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: re-resolve "server" after redeploy (avoids 502 on stale IP)
    set $oam_upstream server:3000;

    location /api/ {
        proxy_pass http://$oam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /static/ {
        proxy_pass http://$oam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://$oam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Socket.IO (Nest /stream namespace). Must be before SPA; not the HLS /stream/ files.
    location /socket.io/ {
        proxy_pass http://$oam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Dual-slot playlist. Touch encode via mirror (failures must NOT 500 the m3u8 —
    # auth_request returned 500 when Nest touch blipped → false "эфир почти готов").
    location ~ ^/stream/(?<hls_ch>[^/]+)/(?<hls_slot>a|b)/playlist\.m3u8$ {
        mirror /internal/hls-touch;
        mirror_request_body off;
        alias /data/stream/$hls_ch/$hls_slot/playlist.m3u8;
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin * always;
        error_page 404 = @hls_preparing;
    }

    # Legacy flat playlist (pre dual-slot) — keep for cold migrate.
    location ~ ^/stream/(?<hls_ch>[^/]+)/playlist\.m3u8$ {
        mirror /internal/hls-touch;
        mirror_request_body off;
        alias /data/stream/$hls_ch/playlist.m3u8;
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin * always;
        error_page 404 = @hls_preparing;
    }

    location = /internal/hls-touch {
        internal;
        proxy_pass http://$oam_upstream/api/stream/hls-touch?folder=$hls_ch;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    location @hls_preparing {
        default_type text/plain;
        add_header Cache-Control no-cache always;
        add_header Access-Control-Allow-Origin * always;
        add_header Retry-After 2 always;
        return 503 "HLS preparing";
    }

    # HLS segments from shared SSD volume (Nest writes, nginx reads)
    location /stream/ {
        alias /data/stream/;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin * always;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/iso.segment m4s;
            application/octet-stream m4s;
        }

        autoindex off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
